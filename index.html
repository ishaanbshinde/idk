<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Before We Begin...</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">

        <section class="entry-screen">

            <div class="entry-glow"></div>

            <div class="entry-card">

                <h1>Before We Begin...</h1>

                <p class="entry-subtitle">
                    Just a tiny thing I made. 👀
                </p>

                <form id="entryForm">

                    <div class="input-group">
                        <label for="name">Who are you?</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="off"
                            placeholder="Your name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">You know this one.</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="off"
                            placeholder="Enter the clue..."
                            required
                        >
                    </div>

                    <button type="submit" id="enterButton">
                        Continue →
                    </button>

                </form>

                <p
                    id="entryMessage"
                    class="entry-message"
                    aria-live="polite"
                ></p>

                <p class="privacy-note">
                    🔒 Just a small private experience.
                </p>

            </div>

        </section>

    </main>


    <script>

        // ==========================================
        // EXPERIENCE ACCESS
        // ==========================================

        const ENTRY_NAME = "Demo";

        // The secret clue 👀
        const ENTRY_PASSWORD = "demo";


        // ==========================================
        // ELEMENTS
        // ==========================================

        const entryForm = document.getElementById("entryForm");
        const entryMessage = document.getElementById("entryMessage");
        const enterButton = document.getElementById("enterButton");

        const nameInput = document.getElementById("name");
        const passwordInput = document.getElementById("password");


        // ==========================================
        // LOGIN
        // ==========================================

        entryForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const name = nameInput.value.trim();
            const password = passwordInput.value.trim();


            // ======================================
            // EMPTY FIELDS
            // ======================================

            if (!name || !password) {

                entryMessage.textContent =
                    "You gotta fill both 😭";

                return;
            }


            // ======================================
            // CHECKING
            // ======================================

            enterButton.disabled = true;
            enterButton.textContent = "Checking...";
            entryMessage.textContent = "";


            // ======================================
            // CORRECT PERSON + CORRECT CLUE
            // ======================================

            if (
                name.toLowerCase() === ENTRY_NAME.toLowerCase() &&
                password.toLowerCase() === ENTRY_PASSWORD.toLowerCase()
            ) {

                entryMessage.textContent =
                    "Okay... it's you. 👀";

                enterButton.textContent =
                    "Entering...";


                setTimeout(() => {

                    // Save the name so experience.js
                    // can send it to the backend.

                    localStorage.setItem(
                        "experienceName",
                        name
                    );


                    // Enter the actual experience.

                    window.location.href =
                        "experience.html";

                }, 600);

                return;
            }


            // ======================================
            // CORRECT PERSON + WRONG CLUE
            // ======================================

            if (
                name.toLowerCase() === ENTRY_NAME.toLowerCase()
            ) {

                entryMessage.textContent =
                    "Hmm... think again 👀";

                enterButton.disabled = false;

                enterButton.textContent =
                    "Continue →";

                passwordInput.focus();

                return;
            }


            // ======================================
            // ANYONE ELSE 💀

            window.location.href =
                "https://heheishanhasdonethis.netlify.app";

        });

    </script>

</body>
</html>
