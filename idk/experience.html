<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Experience • 27/8/26</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main id="experienceApp">

        <!-- =====================================
             INTRO
             ===================================== -->

        <section
            class="experience-screen"
            id="introScreen"
        >

            <p class="eyebrow">
                EXPERIENCE • 27/8/26
            </p>


            <!-- =================================
                 VINYL / MUSIC
                 ================================= -->

            <div class="vinyl-player">

                <div
                    class="vinyl-record"
                    id="vinylRecord"
                >

                    <div class="vinyl-label">

                        <span class="vinyl-label-title">
                            27/8/26
                        </span>

                        <span class="vinyl-label-subtitle">
                            EXPERIENCE
                        </span>

                    </div>

                    <div class="vinyl-hole"></div>

                </div>


                <div class="music-info">

                    <p class="music-label">
                        NOW PLAYING
                    </p>

                    <h2 id="trackTitle">
                        I Wanna Be Yours
                    </h2>

                    <p id="trackNumber">
                        Track 1 of 3
                    </p>

                </div>


                <div class="music-controls">

                    <button
                        type="button"
                        id="playPauseButton"
                        aria-label="Play music"
                    >
                        ▶
                    </button>

                    <input
                        type="range"
                        id="volumeControl"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.7"
                        aria-label="Volume"
                    >

                </div>

            </div>


            <!-- =================================
                 INTRO TEXT
                 ================================= -->

            <div
                class="intro-section"
                id="introSection"
            >

                <p
                    class="intro-counter"
                    id="introCounter"
                >
                    1 / 6
                </p>


                <p
                    class="intro-text"
                    id="introText"
                >
                    Hi um... kya kar rahi hai? 😭
                </p>


                <button
                    type="button"
                    id="continueButton"
                >
                    Continue →
                </button>

            </div>

        </section>


        <!-- =====================================
             Q&A EXPERIENCE
             ===================================== -->

        <section
            class="qa-section"
            id="qaSection"
            hidden
        >

            <p class="eyebrow">
                All these questions ke honestly answer dena 👀
            </p>


            <p
                class="qa-counter"
                id="qaCounter"
            >
                Question 1
            </p>


            <h2 id="questionText">
                Maine bhot months se notice kiya hai tera behavior towards me...
            </h2>


            <p id="questionSubtitle">
                and honestly... I kinda like it.
            </p>


            <!-- =================================
                 DYNAMIC OPTIONS
                 
                 JS WILL PUT:
                 - Question 2 buttons
                 - Final choice buttons
                 
                 INSIDE THIS CONTAINER.
                 ================================= -->

            <div
                id="optionsContainer"
                class="options-container"
            ></div>


            <!-- =================================
                 TEXT ANSWER
                 ================================= -->

            <textarea
                id="answerInput"
                placeholder="Type your answer..."
                rows="5"
                maxlength="1000"
            ></textarea>


            <button
                type="button"
                id="submitAnswerButton"
            >
                Submit →
            </button>


            <p
                class="qa-message"
                id="qaMessage"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <!-- =====================================
         EXPERIENCE JAVASCRIPT
         ===================================== -->

    <script
        src="js/experience.js"
    ></script>

</body>

</html>
